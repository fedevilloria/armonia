services:
  postgres:
    image: postgres:16
    container_name: armonia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: armonia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - armonia_postgres_data:/var/lib/postgresql/data

volumes:
  armonia_postgres_data: